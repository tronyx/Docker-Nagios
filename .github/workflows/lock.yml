name: Lock closed stale issue

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  lock:
    if: github.event.label.name == 'closed-no-issue-activity'
    runs-on: ubuntu-latest
    steps:
      - uses: thisisnacho/lock-issues@v1.2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"