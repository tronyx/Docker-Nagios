---

# Example setup that keeps the Nagios configuration and data in volumes, so you can upgrade
# the image without losing your site's configuration.

services:
  nagios:
    image: tronyx/nagios:latest
    #image: tronyx/nagios:develop
    container_name: nagios
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NAGIOS_TIMEZONE: America/New_York
      # Web interface admin password, only used on first start. If none is set, a random one is
      # generated and logged: docker logs nagios 2>&1 | grep 'Generated password'
      # Prefer the secret (see the bottom of this file); NAGIOSADMIN_PASS shows up in docker inspect.
      #NAGIOSADMIN_PASS_FILE: /run/secrets/nagiosadmin_pass
      #NAGIOSADMIN_PASS: change-me
    #secrets:
    #  - nagiosadmin_pass
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Named volumes (declared at the bottom of this file)
      - nagiosetc:/opt/nagios/etc
      - nagiosvar:/opt/nagios/var
      - customplugins:/opt/Custom-Nagios-Plugins
      - nagiosgraphvar:/opt/nagiosgraph/var
      - nagiosgraphetc:/opt/nagiosgraph/etc
      - nagiosa2logs:/var/log/apache2
      # Bind mounts: use these instead of the named volumes above to keep the data in host
      # directories. Empty directories are seeded with the default config on first start and
      # chowned to the container's nagios user (UID/GID 5000).
      #- ./data/nagios/etc:/opt/nagios/etc
      #- ./data/nagios/var:/opt/nagios/var
      #- ./data/custom-plugins:/opt/Custom-Nagios-Plugins
      #- ./data/nagiosgraph/var:/opt/nagiosgraph/var
      #- ./data/nagiosgraph/etc:/opt/nagiosgraph/etc
      #- ./data/apache2-logs:/var/log/apache2

# Only needed for the named volumes; remove this section when using bind mounts
volumes:
    nagiosetc:
    nagiosvar:
    customplugins:
    nagiosgraphvar:
    nagiosgraphetc:
    nagiosa2logs:

# Only needed for NAGIOSADMIN_PASS_FILE above; put the password in nagiosadmin_pass.txt
#secrets:
#  nagiosadmin_pass:
#    file: ./nagiosadmin_pass.txt
